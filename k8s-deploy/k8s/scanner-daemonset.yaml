apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: triangle-scanner
  namespace: npe-learner
  labels:
    app: triangle-scanner
spec:
  selector:
    matchLabels:
      app: triangle-scanner
  template:
    metadata:
      labels:
        app: triangle-scanner
    spec:
      containers:
        - name: scanner
          image: triangle-scanner:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: ANALYZER_URL
              value: "http://pdf-analyzer-service:5000"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WATCH_PATH
              value: "/host-fs"
          volumeMounts:
            - name: host-tmp
              mountPath: /host-fs
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
