apiVersion: v1
kind: ServiceAccount
metadata:
  name: triangle-scanner-sa
  namespace: npe-learner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triangle-scanner-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triangle-scanner-binding
subjects:
  - kind: ServiceAccount
    name: triangle-scanner-sa
    namespace: npe-learner
roleRef:
  kind: ClusterRole
  name: triangle-scanner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: triangle-scanner
  namespace: npe-learner
  labels:
    app: triangle-scanner
spec:
  selector:
    matchLabels:
      app: triangle-scanner
  template:
    metadata:
      labels:
        app: triangle-scanner
    spec:
      serviceAccountName: triangle-scanner-sa
      containers:
        - name: scanner
          image: triangle-scanner:v3
          imagePullPolicy: IfNotPresent
          env:
            - name: ANALYZER_URL
              value: "http://pdf-analyzer-service:5000"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WATCH_PATH
              value: "/host-fs"
          volumeMounts:
            - name: host-tmp
              mountPath: /host-fs
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: host-tmp
          hostPath:
            path: /tmp
            type: DirectoryOrCreate
