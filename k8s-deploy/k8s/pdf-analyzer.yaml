apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-analyzer
  namespace: npe-learner
  labels:
    app: pdf-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-analyzer
  template:
    metadata:
      labels:
        app: pdf-analyzer
    spec:
      containers:
        - name: pdf-analyzer
          image: npe-pdf-analyzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-analyzer-service
  namespace: npe-learner
  labels:
    app: pdf-analyzer
spec:
  type: ClusterIP
  selector:
    app: pdf-analyzer
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
